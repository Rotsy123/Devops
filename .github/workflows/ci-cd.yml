name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run server tests
        run: npm run test:server

      - name: Build project
        run: npm run build

  lint:
    name: Vérification du code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server.js syntax
        run: node -c server.js

      - name: Check index.js syntax
        run: node -c index.js

  build:
    name: Build et vérification
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify server starts
        run: |
          timeout 10s node server.js &
          sleep 4
          curl -f http://localhost:3000 \
            && echo "✅ Serveur accessible" \
            || (echo "❌ Serveur non accessible" && exit 1)
          pkill -f "node server.js" || true

  deploy:
    name: Déploiement (Self-hosted Runner)
    runs-on: self-hosted  # Utilise le runner installé sur le serveur
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🚀 Déploiement local (pas besoin de SSH, on est déjà sur le serveur)
      - name: Deploy application
        run: |
          APP_DIR="${HOME}/devops-app"

          echo "📦 Déploiement dans $APP_DIR"

          mkdir -p "$APP_DIR"

          rsync -av \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='actions-runner' \
            ./ "$APP_DIR/"

          cd "$APP_DIR"

          echo "📦 Installation des dépendances..."
          npm ci --omit=dev

          echo "🛑 Arrêt de l'application existante..."
          pkill -f "node server.js" || true
          sleep 2

          echo "🚀 Démarrage de l'application..."
          RUNNER_TRACKING_ID="" nohup node server.js > app.log 2>&1 &
          echo $! > app.pid

          sleep 4

          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Application démarrée avec succès"
          else
            echo "❌ Échec du démarrage"
            tail -n 100 "$APP_DIR/app.log" || true
            exit 1
          fi
          echo "✅ Déploiement terminé"
          echo "📁 Application déployée dans: $APP_DIR"